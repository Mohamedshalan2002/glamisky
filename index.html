  <body>

    <script>
      // Temporary boot-error trap (diagnostics) — shows runtime errors on screen.
      (function () {
        function show(id, bg, text) {
          try {
            var el = document.getElementById(id);
            if (!el) {
              el = document.createElement('pre');
              el.id = id;
              el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:99999;background:' + bg + ';color:#fff;padding:12px;font:12px monospace;white-space:pre-wrap;margin:0;';
              (document.body || document.documentElement).appendChild(el);
            }
            el.textContent += text + '\n';
          } catch (_) {}
        }
        window.addEventListener('error', function (e) {
          show('boot-error', '#900', 'BOOT ERROR: ' + e.message + '\n  at ' + (e.filename || '?') + ':' + e.lineno + ':' + e.colno);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('boot-error', '#906', 'UNHANDLED REJECTION: ' + ((r && r.stack) || r));
        });
      })();
    </script>
